<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d3b73">
    <title>ShopAssist | Customer Support</title>

    <!-- Manrope font (falls back to system fonts if unavailable) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="chat-container">

        <header class="chat-header">
            <div class="bot-avatar">S</div>

            <div class="header-info">
                <h1>ShopMate</h1>
                <p><span class="status-dot"></span> Online Support</p>
            </div>

            <span class="header-badge">FAQ Bot</span>
        </header>

        <main class="chat-messages" id="chatMessages">
            <div class="welcome-message">
                <div class="welcome-icon">👋</div>
                <h2>Hey there!</h2>
                <p>Welcome to ShopMate. How can we help you today?</p>
            </div>

            <div class="message bot-message welcome-bubble">
                You can ask me about orders, delivery, returns,
                refunds and payment methods
            </div>
        </main>

        <div class="suggestion-section">
            <p class="suggestion-title">Quick questions</p>

            <div class="suggestions">
                <button type="button"
                        onclick="sendSuggestion('How can I track my order?')">
                    📦 Track order
                </button>

                <button type="button"
                        onclick="sendSuggestion('What is your return policy?')">
                    ↩ Returns
                </button>

                <button type="button"
                        onclick="sendSuggestion('Which payment methods do you accept?')">
                    💳 Payments
                </button>
            </div>
        </div>

        <form id="chatForm" class="chat-input">
            <input
                type="text"
                id="userInput"
                placeholder="Ask us anything..."
                autocomplete="off"
                maxlength="500"
                aria-label="Type your question"
                required
            >

            <button type="submit" id="sendButton" aria-label="Send message">
                Send ↑
            </button>
        </form>

        <footer class="chat-footer">
            Powered by Python NLP · ShopMate
        </footer>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
